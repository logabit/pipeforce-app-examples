pipeline:
  - event.listen:
      key: "property.created"
      filter: "#{body.target.path.contains('global/app/applicationform/object/applicationform/v1/instance')}"

  - mail.send:
      message: "$uri:property:global/app/applicationform/template/applicationform-message"
      subject: "Formular Bewerbungsportal wurde ausgefüllt"
      model: "$uri:property:#{body.target.path}"
      to: "#{@property.lazy('global/app/applicationform/config/app#recipient')}"

